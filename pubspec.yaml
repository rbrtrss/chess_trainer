name: chess_trainer
description: "Calculation training that withholds all feedback until the session ends."
# This is a personal application, not a package. Never publish it to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Chess board rendering and interaction. GPL-3.0, same as this project.
  chessground: ^10.1.1
  # The single source of truth for legality, FEN, SAN and PGN (Constitution III).
  # GPL-3.0.
  dartchess: ^0.13.1
  # State management (Constitution, Technology Constraints). MIT.
  flutter_riverpod: ^3.0.3
  # IList/IMap for the immutable domain types. MIT, and already a transitive
  # dependency of chessground, so no new licence surface.
  fast_immutable_collections: ^11.0.4
  # @immutable annotations for the domain layer. BSD-3-Clause.
  meta: ^1.17.0

  # The chess engine, for positions a study author set up without a solution
  # (005 FR-007). GPL-3.0 — the same licence as this project, and published by
  # the Lichess team who publish `dartchess` and `chessground`, adopted for the
  # same reason.
  #
  # **It is the most expensive dependency here by a wide margin**, and the cost
  # was measured before it was adopted (005 research D10): the arm64 split APK
  # goes from 34.9 MB to 79.7 MB. Almost all of that is one embedded neural
  # network — `libmultistockfish_sf16.so` is 39.5 MB, against 1.5 MB for the
  # chess library without a network. Embedding was chosen deliberately over
  # fetching the network at runtime, so that evaluation works from the moment
  # the app is installed and this feature adds no network path at all
  # (Constitution II).
  #
  # Confined to lib/data/engine/ — nothing outside it knows an engine exists,
  # and `test/domain/layering_test.dart` enforces that.
  multistockfish: ^0.5.0

  # Local persistence over SQLite (Constitution, Technology Constraints). MIT.
  # Confined to lib/data/local/ — nothing outside it knows SQLite exists.
  drift: ^2.34.3
  # Resolves the database file under the app documents directory and runs it on
  # a background isolate. MIT.
  #
  # Deliberately NOT sqlite3_flutter_libs: it resolves to 0.6.0+eol, arrives
  # transitively as a no-op, and adding it reintroduces the Flutter-specific
  # build scripts the package exists to retire (research, "A trap worth naming").
  drift_flutter: ^0.3.1

  # ---------------------------------------------------------------------------
  # Feature 003. Licences checked on pub.dev before adoption, as the
  # constitution requires; every one is GPL-3.0 compatible.
  # ---------------------------------------------------------------------------

  # Picking a PGN through the Storage Access Framework, which grants access to
  # the one file the player chose — so the app needs no storage permission at
  # all. BSD-3-Clause, published by flutter.dev. Chosen over file_picker for its
  # narrower surface (003 research D1).
  file_selector: ^1.1.0

  # The only HTTP client, and it is confined to lib/data/lichess/. Nothing else
  # in lib/ may mention it; test/domain/layering_test.dart enforces that in both
  # directions (003 research D2, D14). BSD-3-Clause.
  http: ^1.6.0

  # SHA-256, for the PKCE code challenge and for import duplicate detection
  # (003 research D3, D13). BSD-3-Clause.
  crypto: ^3.0.7

  # Where the Lichess access token lives (Constitution, Secrets). BSD-3-Clause.
  # Paired with android:allowBackup="false" so the token cannot leave the device
  # inside a Google backup (003 research D4).
  #
  # Pinned below 11.x, which research picked as the latest: 11.0.0 sets
  # `compileSdk = 37`, and the Android SDK manager publishes no plain
  # `platforms;android-37` — only minor-versioned `android-37.0`, `37.1` and so
  # on — so Gradle cannot resolve the platform and the build fails on the
  # plugin, not on us. 10.3.1 uses compileSdk 36 and builds. Same API surface;
  # revisit when a plain android-37 platform exists or the plugin addresses a
  # minor version.
  flutter_secure_storage: ^10.3.1

  # A Chrome Custom Tab for the OAuth authorization page, and the Android
  # activity that catches the redirect. Not an embedded WebView: the player must
  # see a real lichess.org address bar. MIT (003 research D3).
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation for the Drift schema. MIT / BSD-3-Clause.
  # After this feature, `flutter test` and `flutter run` fail on a fresh clone
  # until `dart run build_runner build --delete-conflicting-outputs` has been
  # run (research D8). Generated *.g.dart files are gitignored on purpose.
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

flutter:
  uses-material-design: true

  assets:
    # Bundled sample positions, authored as PGN (research D4).
    - assets/positions/
