include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # The domain layer is pure Dart by constitution; an accidental relative
    # import that crosses a layer boundary should be loud.
    always_use_package_imports: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_use_package_imports
    - prefer_final_locals
    - unawaited_futures
    - avoid_print
